name: Publish to npm

# 自动发布触发条件（与兄弟包一致）：
#   1) 推送形如 v0.2.1 的 tag
#   2) 在 GitHub 上发布 Release（published）
# 使用 npm Trusted Publisher（OIDC），无需 NPM_TOKEN 明文密钥。
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
