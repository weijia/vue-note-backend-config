name: Publish to npm

# 自动发布触发条件：推送形如 v0.2.2 的 tag 时触发（仅此一种触发，
# 避免 push:tags 与 release:published 同时触发导致重复发布冲突）。
# 使用 npm Trusted Publisher（OIDC），无需 NPM_TOKEN 明文密钥。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
